# This pipeline uses centralized infrastructure from dbt_package_automations.
# Configure TEST_* flags below to control which warehouses are tested.
# Environment variables and secrets are automatically handled by the central scripts.

env:
  # Configure which warehouse tests to run (true/false)
  TEST_POSTGRES: true
  TEST_SNOWFLAKE: true
  TEST_BIGQUERY: true
  TEST_REDSHIFT: true
  TEST_DATABRICKS: true
  TEST_DATABRICKS_SQL: false
  TEST_SQLSERVER: false

# Pipeline steps will be loaded by pre-command hook