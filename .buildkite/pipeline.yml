# TEMPORARY — final smoke test of the merged solution_analytics main (Slack CI telemetry).
# Hand-written instead of calling execute_buildkite_pipeline.sh, to limit this test run to
# just postgres (fastest warehouse) rather than the full matrix - execute_buildkite_pipeline.sh
# doesn't have a "just one warehouse" option, and this is throwaway, so not worth adding one.
# Remove this file once testing is done — repos should not normally have .buildkite/pipeline.yml.
#
# The postgres/snowflake steps are faked (just "exit 0"/"exit 1") instead of
# running the real dbt tests, for faster iteration while debugging the Slack
# notifier itself - swap the real run_warehouse_tests.sh command back in
# before actually validating warehouse tests.
steps:
  - label: ":postgres: [FAKED] Run Tests - Postgres"
    key: "run_dbt_postgres_v1"
    commands: |
      echo "Faking a passing postgres test for faster Slack notifier iteration"
      exit 0

  - label: ":snowflake-db: [FAKED] Run Tests - Snowflake"
    key: "run_dbt_snowflake_v1"
    commands: |
      echo "Faking a failing snowflake test for faster Slack notifier iteration"
      exit 1

  - label: ":slack: Notify Slack - Main CI Result"
    key: "notify_slack_main_result"
    if: build.branch == "main" || build.branch == "test/slack-notifications"
    allow_dependency_failure: true
    depends_on:
      - "run_dbt_postgres_v1"
      - "run_dbt_snowflake_v1"
    commands: |
      git clone --depth 1 --branch "slack-notify-failure-link" "git@github.com:fivetran/solution_analytics.git" "/tmp/solution_analytics"
      cp -r /tmp/solution_analytics/.buildkite/scripts/. ./solution_analytics_scripts
      ./solution_analytics_scripts/slack/notify_main_ci_result.sh "run_dbt_postgres_v1" "run_dbt_snowflake_v1"
