# This pipeline uses centralized infrastructure from dbt_package_automations.
# Configure TEST_* flags below to control which warehouses are tested.
# Environment variables and secrets are automatically handled by the central scripts.

env:
  # Configure which warehouse tests to run (true/false)
  TEST_POSTGRES: true
  TEST_SNOWFLAKE: true
  TEST_BIGQUERY: true
  TEST_REDSHIFT: true
  TEST_DATABRICKS: true
  TEST_DATABRICKS_SQL: false
  TEST_SQLSERVER: false

steps:
  - label: ":gear: Load Central Pipeline"
    key: "load_pipeline"
    command: |
      # Download and load pipeline from dbt_package_automations
      curl -f -s https://raw.githubusercontent.com/fivetran/dbt_package_automations/feature/centralized-bk/.buildkite/pipeline.yml \
        | buildkite-agent pipeline upload