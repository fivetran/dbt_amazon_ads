name: 'generate dbt docs'
on:
  pull_request:
    types:
      - labeled

jobs:
  generate-docs:
    if: |
      github.event.label.name == 'docs:ready' ||
      github.event.label.name == 'merge:ready'
    uses: fivetran/dbt_package_automations/.github/workflows/generate-docs.yml@docs-generator-status-report
    secrets: inherit
    with:
      schema_var_name: amazon_ads_schema
