name: Agent triage

# Runs only when a maintainer adds the `agent:triage` label.
# The called workflow reads the PR as text and never runs its code.
#
# POC: uses `pull_request` so we can test from a branch before this file is on main.
# With `pull_request`, fork PRs get no secrets, so the run skips Claude for them.
# Before rollout, switch to `pull_request_target`. It loads this file from main, so a PR
# cannot change it, and it lets fork PRs use the key.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  triage:
    if: github.event.label.name == 'agent:triage'
    # POC: points at the poc/agent-triage branch. Switch both refs to main after merge.
    uses: fivetran/dbt_package_automations/.github/workflows/agent-triage.yml@poc/agent-triage
    secrets: inherit
    with:
      automations_ref: poc/agent-triage
