name: Agent triage

# Runs when someone with write access adds the `agent:triage` label, and on new pushes
# to clear a stale verdict label. The called workflow reads the PR as text and never
# runs its code.
#
# POC: uses `pull_request` so we can test from a branch before this file is on main.
# Before rollout, switch to `pull_request_target` (loads this file from main, so a PR
# cannot change it) and pin both refs below to a release tag or commit.
on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: write  # only the create-branch job uses write
  pull-requests: read

jobs:
  triage:
    if: github.event.action == 'synchronize' || github.event.label.name == 'agent:triage'
    uses: fivetran/dbt_package_automations/.github/workflows/agent-triage.yml@poc/agent-triage
    with:
      automations_ref: poc/agent-triage
    secrets: inherit
