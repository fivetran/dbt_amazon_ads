version: 1.4.0
pr_number: 68
new_features:
- description: Raises the minimum supported dbt version from v1.3.0 to v1.10.0.
under_the_hood:
- description: Adds `dbt_utils.unique_combination_of_columns` tests to the staging and end models. The tests use the `arguments` syntax introduced in dbt v1.10.0, the new minimum supported version.
- title: Column description corrections
  description: Corrects inaccurate column descriptions in the package documentation.
    No model output or schema changes.
  details:
  - '`default_bid` in `amazon_ads__ad_group_report` described a record creation date,
    and now describes the ad group''s default bid.'
  - '`ad_group_id` and `ad_group_name` in `amazon_ads__ad_group_report`, and `ad_group_name`
    in `amazon_ads__ad_report`, referenced the campaign doc blocks and now reference
    the ad group doc blocks.'
  - '`keyword_type` and `match_type` shared two duplicate doc blocks, and now share
    a single `keyword_match_type` doc block across the source, staging, and end model
    documentation.'
  - The portfolio budget descriptions in `amazon_ads__portfolio_report` described
    the Amazon Ads API request contract, and now describe the warehouse columns.
