# Test scenarios configuration for Amazon Ads dbt package
# This file defines the different test scenarios to run during CI/CD

# The dbt variable name that controls which schema to use for testing
schema_variable_name: "amazon_ads_schema"

# Optional warehouse configuration (only specify if needed)
include_databricks_sql: true

# Dbt adapter versions (optional - defaults will be used if not specified)
dbt_adapter_versions:
  snowflake: ">=1.3.0,<1.6.0"
  bigquery: ">=1.3.0,<2.0.0"
  postgres: ">=1.3.0,<2.0.0"
  redshift: ">=1.3.0,<2.0.0"
  databricks: ">=1.3.0,<2.0.0"

# List of test scenarios to run
test_scenarios:
  - name: "default"
    vars: {}
    include_incremental: false
  - name: "portfolio history disabled"
    vars:
      amazon_ads__portfolio_history_enabled: false
    include_incremental: false
