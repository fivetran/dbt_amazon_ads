# Only set if not using default adapter ranges
# dbt_adapter_versions:
#   snowflake: ">=1.3.0,<2.0.0"
#   bigquery: ">=1.3.0,<2.0.0"
#   postgres: ">=1.3.0,<2.0.0"
#   redshift: ">=1.3.0,<2.0.0"
#   databricks: ">=1.6.0,<2.0.0"

schema_variable_name: "amazon_ads_schema"

include_databricks_sql: false
include_sqlserver: false
include_duckdb: true
include_dbt_compile: true

test_scenarios:
  - name: "Default"
    vars: {}
    include_incremental: false

  - name: "portfolio history disabled"
    vars:
      amazon_ads__portfolio_history_enabled: false
    include_incremental: false

  # POC only - not yet runnable in real CI. Verified manually on DuckDB by hand-provisioning
  # a second schema (zz_dbt_catherine_conn2) with campaign_history data under the alias
  # "campaign_history_renamed", then running with exactly this scenario's vars. Both
  # connections unioned correctly, each resolving its own __identifier__ override.
  # Still needed for this to run for real in solution_analytics CI: the runner needs to
  # provision + seed a second (renamed-table) schema per warehouse before this scenario
  # executes, and clean it up after. See conversation with Claude for full context.
  - name: "Union connections with custom table name"
    vars:
      amazon_ads_sources:
        - database: "dbt"
          schema: "zz_dbt_catherine"
          name: "conn1"
        - database: "dbt"
          schema: "zz_dbt_catherine_conn2"
          name: "conn2"
      amazon_ads_custom_names:
        zz_dbt_catherine_conn2:
          campaign_history:
            __identifier__: campaign_history_renamed
    include_incremental: false

  - name: "MDLS"
    vars:
      fivetran_using_source_casing: true
    include_incremental: false
    include_dbt_seed: true
